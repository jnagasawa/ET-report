project:
  type: book
  
book:
  title: "Data Analysis Report: Attentional spatial bias in two image tasks"
  author:
    - name: "Junichi Nagasawa"
      affiliation: "University of Stuttgart, Kwansei Gakuin University"
      orcid: "0009-0001-5866-7348"
    - name: "Sanaz Talebi"
      affiliation: "University of Stuttgart"
    - name: "Nikhil Pandey"
      affiliation: "University of Stuttgart"
    - name: "Shehab Solyman"
      affiliation: "University of Stuttgart"
  output-file: "report"

  chapters:
    - index.qmd
    - chapters/01-intro.qmd
    - chapters/02-methods.qmd
    - chapters/03-results.qmd
    - chapters/04-discussion.qmd
    - chapters/05-contribution-table.qmd
    - references.qmd

bibliography: references.bib

format:
  titlepage-pdf:
    documentclass: report
    keep-tex: false
    colorlinks: true
    titlepage: true
    titlepage-theme:
      elements: ["\\titleblock", "\\authorblock", "\\vfill"]
      page-align: "center"
      title-style: "plain"
      title-fontsize: 28
      title-align: "center"
      author-style: "author-address"
      author-fontsize: 14
      author-align: "center"
      affiliation-style: "none"
      affiliation-sep: ", "
  html:
    theme: cosmo